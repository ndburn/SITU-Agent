name: Feature Request
description: Suggest a new capability or improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Feature requests are welcome. The core constraint is that **RESTRICTED mode must remain fully air-gapped** — proposals that introduce mandatory network access to the agent pod will not be accepted.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case or pain point — not the solution yet.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see added or changed?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why they don't fit.
    validations:
      required: false

  - type: checkboxes
    id: constraints
    attributes:
      label: Constraint check
      options:
        - label: This change does not add network access to the agent pod in RESTRICTED mode.
          required: true
        - label: This change does not add a mandatory cloud dependency.
          required: true
