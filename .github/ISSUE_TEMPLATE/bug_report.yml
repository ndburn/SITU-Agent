name: Bug Report
description: Something is broken or behaving unexpectedly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: search existing issues to avoid duplicates.
        **Security vulnerability?** Do not open a public issue — email andreas.burner@gmail.com instead.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact commands run, config used, etc.
      placeholder: |
        1. `cp situ.conf my.conf && echo 'MODEL=gemma-3-4b-q4.gguf' >> my.conf`
        2. `scripts/situ.sh -c my.conf`
        3. …
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Full terminal output
      description: Paste the complete output. Use triple backticks if it's long.
      render: shell
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS and version
      placeholder: "macOS 15.4 / Ubuntu 24.04"
    validations:
      required: true

  - type: input
    id: podman
    attributes:
      label: Podman version
      placeholder: "podman version 5.4.2"
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Model used
      placeholder: "gemma-3-4b-it-q4_k_m.gguf"
    validations:
      required: false

  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - RESTRICTED (default — no network)
        - NETWORK (external LM server)
    validations:
      required: true
