# SITU Configuration

# MODE: RESTRICTED = pod-only, no external traffic (default). NETWORK = external network allowed.
# MODE=RESTRICTED

# MOUNTPOINT: directory used by SITU container. if not set, SITU will use the current working directory
# MOUNTPOINT=/mnt/encrypted/workspace

# LLAMA_IMAGE: llama.cpp server container image. Default is official CPU build. CUDA builds are available as well.
# LLAMA_IMAGE=ghcr.io/ggml-org/llama.cpp:server-cuda

# LM_HOST / LM_PORT: Instead of a pod, connect to a LM server on the network. Requires MODE=NETWORK.
# LM_HOST=192.168.1.100
# LM_PORT=8080

# LMS_READY_TIMEOUT: seconds to wait for the LM server to finish loading the model (default 180)
# LMS_READY_TIMEOUT=180

# MODEL: GGUF model path relative to the models directory (only for local sidecar)
MODEL=gemma-4-E4B-it-Q4_K_M.gguf

# CTX_SIZE: context window size in tokens. 0 = use the model's own training context size (default).
CTX_SIZE=0

# TEMPERATURE: sampling temperature passed to the llama.cpp sidecar (only for local sidecar).
# TEMPERATURE=0.1

# MAX_TOKENS: per-call generation budget for the agent in tokens (default 16384).
# MAX_TOKENS=16384

# REASONING: enable agent reasoning/thinking (true/false, default false).
# REASONING=false

# REASONING_BUDGET_MAXPERCENT: thinking token cap as % of MAX_TOKENS (default 25, 0 = off, -1 = unlimited).
# REASONING_BUDGET_MAXPERCENT=25

# REASONING_BUDGET_MESSAGE: message injected before </think> when budget is exhausted.
# REASONING_BUDGET_MESSAGE=$'\n\nLet me now write the solution.'

# PARALLEL: parallel request slots in the llama.cpp server; increase when multiple SITU pods share one llamaservice.
# PARALLEL=1
